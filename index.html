<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Специалист по интернет-торговле — Вадим Лопатин</title>
<style>
  * { box-sizing: border-box; }

  /* Фон всей страницы — плитка одной картинки */
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 20px;
    background: #eef3f7 url('https://picsum.photos/300/300') repeat;
    background-size: 300px 300px; /* размер одной плитки */
  }

  /* Шапка страницы */
  .header {
    display: flex;
    align-items: center;
    gap: 20px;
    max-width: 560px;
    margin: 0 auto 60px; /* увеличенный отступ снизу: было 30px */
    padding: 20px;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  .header img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .header h1 {
    margin: 0;
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    line-height: 1.3;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto 20px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  /* Светло-синий, прозрачность 40% */
  .card--blue {
    border: 1px solid #b3cde0;
    background: rgba(173, 216, 230, 0.4);
  }

  /* Светло-жёлтый, прозрачность 40% */
  .card--yellow {
    border: 1px solid #e6d78a;
    background: rgba(255, 243, 170, 0.4);
  }

  .card img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .card-content { flex: 1; min-width: 0; }

  .card h2 {
    margin: 0 0 6px;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    line-height: 1.3;
  }

  .card .price {
    margin: 0 0 12px;
    font-size: 1.05rem;
    font-weight: 600;
  }

  .card--blue .price { color: #1a5276; }
  .card--yellow .price { color: #8a6d1a; }

  .card .btn {
    display: inline-block;
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 0.95rem;
    text-decoration: none; /* убирает подчёркивание у ссылки-кнопки */
    cursor: pointer;
    transition: background 0.2s;
    /* Единая синяя кнопка для обеих карточек */
    background: #2980b9;
  }

  .card .btn:hover { background: #1f6391; }

  /* Адаптив: карточки товаров остаются в строку на всех экранах,
     слегка уменьшаем картинку и внутренние отступы для компактности */
  @media (max-width: 480px) {
    .header { flex-direction: column; text-align: center; }
    .card { padding: 14px; gap: 12px; }
    .card img { width: 70px; height: 70px; }
    .card .price { margin-bottom: 8px; }
    .card .btn { padding: 8px 18px; }
  }
</style>
</head>
<body>

<header class="header">
  <img src="images/me.png" alt="Вадим Лопатин">
  <h1>Специалист по интернет-торговле Вадим Лопатин. Фриланс-услуги для роста продаж на маркетплейсах:</h1>
</header>

<div class="card card--blue">
  <img src="images/vkq.jpg" alt="Изображение товара">
  <div class="card-content">
    <h2>Группа вашего магазина(бренда) в VK и внешний трафик на товары</h2>
    <p class="price">Цена: 7000 рублей</p>
    <a class="btn" href="vk_group.html">Подробнее</a>
  </div>
</div>

<div class="card card--yellow">
  <img src="images/yt.png" alt="Изображение товара">
  <div class="card-content">
    <h2>УТП для товаров на Озон и ВБ</h2>
    <p class="price">Цена: 500 рублей</p>
    <a class="btn" href="utp.html">Подробнее</a>
  </div>
</div>

</body>
